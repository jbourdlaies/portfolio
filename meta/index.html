<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Justin Bourdlaies: Code Meta-Analysis</title>
    <link rel="stylesheet" href="../style.css">
    <script type="module" src="../global.js"></script>
</head>
<body>

    <h1>Code Meta-Analysis</h1>

    <p>
        Welcome to my code meta-analysis page! Here, I will explore
        statistics and visualizations about the code used throughout
        my portfolio.
    </p>

    <div id="stats"></div>

    <h2>Commits by time of day</h2>

    <div id="chart"></div>

    <p id="selection-count">No commits selected</p>

    <dl id="language-breakdown" class="stats"></dl>

    <dl id="commit-tooltip" class="info tooltip" hidden>
        <dt>Commit</dt>
        <dd>
            <a href="" id="commit-link" target="_blank"
                rel="noopener noreferrer"></a>
        </dd>

        <dt>Date</dt>
        <dd id="commit-date"></dd>
    </dl>

    <script src="main.js" type="module"></script>

</body>
</html>
